[project]
name = "scripts"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "akshare>=1.18.92",
]

# 本项目是三个独立的 CLI 脚本而非包，显式声明避免 setuptools flat-layout 自动发现歧义
[tool.setuptools]
py-modules = ["call_interface", "search_interface", "market_analysis", "sector_rotation"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
    "pyright>=1.1.411",
    "ruff>=0.16.3",
]

# CLI 端 pyright 默认 basic 模式会漏报大量类型问题，显式启用 strict 对齐 IDE 检查强度
[tool.pyright]
typeCheckingMode = "strict"
# akshare 无类型存根，从子模块直接导入（绕开超大 __init__ 的解析失效）时
# reportMissingTypeStubs 会误报，全局关闭
reportMissingTypeStubs = false

# CLI 入口需要兜底 akshare 的全部异常（AkshareException 家族、网络、数据源错误），
# 统一转为友好消息退出，属刻意设计，豁免盲捕获告警
[tool.ruff.lint.per-file-ignores]
"call_interface.py" = ["BLE001"]
"search_interface.py" = ["BLE001"]
"market_analysis.py" = ["BLE001"]
"fund_analysis.py" = ["BLE001"]
"sector_rotation.py" = ["BLE001"]
